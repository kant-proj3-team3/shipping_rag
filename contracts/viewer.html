<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAG Q&A 인터페이스 계약 뷰어</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
  --bg: #f7f6f2; --surface: #ffffff; --surface-2: #f1f0ea;
  --text: #1c1b19; --muted: #6a685f; --border: #e2e0d8; --border-strong: #b9b6a9;
  --accent: #5a49b8; --accent-bg: #ece9fa; --accent-text: #3f3190;
  --code-bg: #f1f0ea; --ok: #1f7a4d; --warn: #a15c07; --err: #b3372f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #15151a; --surface: #1e1e25; --surface-2: #26262f;
    --text: #ececf1; --muted: #9b9aa8; --border: #33333f; --border-strong: #55556a;
    --accent: #a79bf2; --accent-bg: #2b2750; --accent-text: #cfc8ff;
    --code-bg: #26262f; --ok: #5fcf9a; --warn: #e8b05a; --err: #f08a82;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #15151a; --surface: #1e1e25; --surface-2: #26262f;
  --text: #ececf1; --muted: #9b9aa8; --border: #33333f; --border-strong: #55556a;
  --accent: #a79bf2; --accent-bg: #2b2750; --accent-text: #cfc8ff;
  --code-bg: #26262f; --ok: #5fcf9a; --warn: #e8b05a; --err: #f08a82;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 22px; margin: 4px 0 2px; }
h2 { font-size: 17px; margin: 0 0 8px; }
h3 { font-size: 14px; margin: 16px 0 6px; color: var(--muted); font-weight: 600; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
pre { background: var(--code-bg); border-radius: 8px; padding: 10px 12px; margin: 6px 0; overflow-x: auto; white-space: pre; }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
.tab {
  appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600;
  padding: 9px 14px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
}
.tab[aria-selected="true"] { color: var(--accent-text); border-bottom-color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
.card.sel { border-color: var(--accent); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
ul.rules { margin: 6px 0 0; padding-left: 18px; }
ul.rules li { margin: 3px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.tlink {
  appearance: none; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--accent-text);
  font: inherit; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px;
  padding: 1px 7px; border-radius: 999px; cursor: pointer; margin: 0 1px;
}
.tlink.if { background: var(--accent-bg); border-color: var(--accent); }
.tlink:hover { border-color: var(--accent); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent-bg); color: var(--accent-text); margin-left: 6px; vertical-align: middle; }
.req { color: var(--err); font-weight: 700; }
.opt { color: var(--muted); }
.muted { color: var(--muted); }
.map { width: 100%; height: auto; display: block; }
.map .node rect { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1; }
.map .node.module rect { fill: var(--accent-bg); stroke: var(--accent); }
.map .node.sel rect { stroke-width: 3; }
.map .node text, .map .flow text, .map .note { fill: var(--text); font-size: 13px; }
.map .small { font-size: 11px; fill: var(--muted) !important; }
.map .clickable { cursor: pointer; }
.map .line { stroke: var(--muted); stroke-width: 1.2; fill: none; }
.map .dash { stroke-dasharray: 5 4; stroke: var(--accent); stroke-width: 1.6; }
.map .flow.sel text { font-weight: 700; fill: var(--accent-text); }
.map .flow .hit { fill: transparent; }
.split { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start; }
.side { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px; max-height: 70vh; overflow-y: auto; }
.side h4 { margin: 10px 8px 4px; font-size: 12px; color: var(--muted); }
.side button {
  display: block; width: 100%; text-align: left; appearance: none; border: 0; background: none; color: var(--text);
  font: inherit; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; padding: 5px 8px; border-radius: 6px; cursor: pointer;
}
.side button[aria-current="true"] { background: var(--accent-bg); color: var(--accent-text); font-weight: 700; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.btn {
  appearance: none; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 8px; cursor: pointer;
}
.btn[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }
.status-answered { color: var(--ok); } .status-needs_clarification { color: var(--warn); }
.status-abstained { color: var(--warn); } .status-error { color: var(--err); }
.foot { margin-top: 28px; font-size: 12px; color: var(--muted); }
@media (max-width: 720px) { .split { grid-template-columns: 1fr; } .side { max-height: 220px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>RAG Q&amp;A 인터페이스 계약</h1>
  <p class="sub">packages/common 코드에서 자동 추출한 읽기 전용 뷰어입니다. 코드가 원본이며, 계약이 바뀌면 이 페이지를 다시 생성합니다.</p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="map" aria-selected="true">모듈 지도</button>
    <button class="tab" role="tab" data-tab="types" aria-selected="false">타입 사전</button>
    <button class="tab" role="tab" data-tab="http" aria-selected="false">HTTP · 예시</button>
  </div>

  <section id="tab-map">
    <div class="card">
      <svg class="map" viewBox="0 0 680 330" role="img" aria-label="모듈과 데이터 흐름 지도. 모듈이나 화살표 이름을 눌러 계약을 확인합니다.">
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>
        <g class="node"><rect x="30" y="14" width="480" height="36" rx="8"/><text x="270" y="37" text-anchor="middle">app/ 조립 · 모듈 구현을 아는 유일한 곳</text></g>
        <path class="line" d="M80 50V96M250 50V96M420 50V96" marker-end="url(#ah)"/>
        <g class="node module clickable" data-kind="module" data-id="chunking"><rect x="30" y="96" width="100" height="64" rx="10"/><text x="80" y="124" text-anchor="middle">청킹</text><text class="small" x="80" y="144" text-anchor="middle">Embedder · Indexer</text></g>
        <g class="node module clickable" data-kind="module" data-id="retrieval"><rect x="200" y="96" width="100" height="64" rx="10"/><text x="250" y="124" text-anchor="middle">검색</text><text class="small" x="250" y="144" text-anchor="middle">Retriever</text></g>
        <g class="node module clickable" data-kind="module" data-id="backend"><rect x="370" y="96" width="100" height="64" rx="10"/><text x="420" y="124" text-anchor="middle">백엔드</text><text class="small" x="420" y="144" text-anchor="middle">QAService</text></g>
        <g class="node module clickable" data-kind="module" data-id="frontend"><rect x="540" y="96" width="100" height="64" rx="10"/><text x="590" y="124" text-anchor="middle">프론트엔드</text><text class="small" x="590" y="144" text-anchor="middle">React</text></g>
        <g class="flow clickable" data-kind="flow" data-id="flow-index"><rect class="hit" x="132" y="100" width="66" height="50"/><path class="line dash" d="M132 134H196" marker-end="url(#ah)"/><text x="165" y="124" text-anchor="middle">인덱스</text></g>
        <g class="flow clickable" data-kind="flow" data-id="flow-retrieve"><rect class="hit" x="302" y="100" width="66" height="50"/><path class="line dash" d="M302 134H366" marker-end="url(#ah)"/><text x="335" y="124" text-anchor="middle">Retriever</text></g>
        <g class="flow clickable" data-kind="flow" data-id="flow-http"><rect class="hit" x="472" y="100" width="66" height="50"/><path class="line dash" d="M472 134H536" marker-end="url(#ah)"/><text x="505" y="124" text-anchor="middle">HTTP</text></g>
        <path class="line" d="M80 160V236M250 160V236M420 160V236" marker-end="url(#ah)"/>
        <path class="line" d="M590 160V236" marker-end="url(#ah)"/>
        <g class="node"><rect x="30" y="238" width="480" height="40" rx="8"/><text x="270" y="262" text-anchor="middle">common · 인터페이스 · 타입 · 오류 · API 상수</text></g>
        <g class="node"><rect x="540" y="238" width="100" height="40" rx="8"/><text x="590" y="262" text-anchor="middle">openapi.json</text></g>
        <text class="note small" x="30" y="312" style="fill:var(--muted)">점선: 런타임 데이터 흐름 (직접 import 아님) · 실선: 의존 · 모듈끼리는 서로 import하지 않습니다</text>
      </svg>
      <p class="sub" style="margin:6px 0 0">모듈 상자나 점선 화살표를 눌러보세요.</p>
    </div>
    <div id="detail"></div>
  </section>

  <section id="tab-types" hidden>
    <div class="split">
      <nav class="side" id="type-list" aria-label="타입 목록"></nav>
      <div id="type-detail"></div>
    </div>
  </section>

  <section id="tab-http" hidden>
    <div id="http-body"></div>
  </section>

  <p class="foot">생성: scripts/build_contract_viewer.py · 원본: packages/common/src/common/{types,interfaces,api}.py</p>
</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s, r = document) => r.querySelector(s);

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}

const providerOf = {};
D.modules.forEach(m => m.provides.forEach(i => providerOf[i] = m.id));
const moduleName = id => (D.modules.find(m => m.id === id) || {}).name || id;

function linkify(text) {
  return String(text).split(/(\w+)/).map(tok => {
    if (D.types[tok]) return h('button', { class: 'tlink', type: 'button', onclick: () => openType(tok) }, tok);
    if (D.interfaces[tok]) return h('button', { class: 'tlink if', type: 'button', onclick: () => openInterface(tok) }, tok);
    return tok;
  });
}
const chips = names => h('div', { class: 'chips' }, names.map(n => linkify(n)));

/* ───────── 탭 ───────── */
function showTab(name) {
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  ['map', 'types', 'http'].forEach(t => { $('#tab-' + t).hidden = (t !== name); });
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

/* ───────── 모듈 지도 ───────── */
let selected = { kind: 'module', id: 'backend' };

function select(kind, id) {
  selected = { kind, id };
  document.querySelectorAll('.map [data-kind]').forEach(g => {
    g.classList.toggle('sel', g.dataset.kind === kind && g.dataset.id === id);
  });
  renderDetail();
}
document.querySelectorAll('.map [data-kind]').forEach(g => {
  g.setAttribute('tabindex', '0');
  g.setAttribute('role', 'button');
  g.addEventListener('click', () => select(g.dataset.kind, g.dataset.id));
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(g.dataset.kind, g.dataset.id); } });
});

function interfaceCard(name) {
  const it = D.interfaces[name];
  return h('div', { class: 'card', id: 'if-' + name },
    h('h2', {}, name, h('span', { class: 'badge' }, 'Protocol')),
    h('p', { class: 'muted', style: 'margin:0 0 6px' }, it.summary),
    h('pre', {}, it.members.map(m => m.sig).join('\n')),
    it.rules.length ? [h('h3', {}, '구현이 반드시 지킬 계약'), h('ul', { class: 'rules' }, it.rules.map(r => h('li', {}, r)))] : null
  );
}

function renderDetail() {
  const box = $('#detail');
  box.replaceChildren();
  if (selected.kind === 'flow') {
    const f = D.flows.find(x => x.id === selected.id);
    box.append(h('div', { class: 'card sel' },
      h('h2', {}, `${f.from} → ${f.to}`, h('span', { class: 'badge' }, '데이터 흐름')),
      h('p', { class: 'muted', style: 'margin:0' }, '방식: ' + f.via),
      h('h3', {}, '오가는 타입'), chips(f.types),
      h('h3', {}, '이 경로에서 지켜야 할 규칙'),
      h('ul', { class: 'rules' }, f.rules.map(r => h('li', {}, r)))
    ));
    return;
  }
  const m = D.modules.find(x => x.id === selected.id);
  box.append(h('div', { class: 'card sel' },
    h('h2', {}, m.name + ' 모듈'),
    h('p', { class: 'muted', style: 'margin:0' }, m.scope),
    m.entry.length ? [h('h3', {}, '진입점 (app이 호출)'), h('pre', {}, m.entry.join('\n'))] : null,
    h('h3', {}, '주입받는 것'),
    m.injected.length ? chips(m.injected) : h('p', { class: 'muted', style: 'margin:0' }, m.id === 'frontend' ? '없음 — contracts/openapi.json 으로만 백엔드와 소통' : '없음'),
    h('h3', {}, '관련 타입'), chips(m.types)
  ));
  if (m.provides.length) {
    box.append(...m.provides.map(interfaceCard));
  } else {
    box.append(h('div', { class: 'card' },
      h('h2', {}, '화면이 구분해서 보여야 하는 것'),
      h('div', { class: 'scroll' }, h('table', {},
        h('thead', {}, h('tr', {}, h('th', {}, 'status'), h('th', {}, '화면 책임'))),
        h('tbody', {}, Object.entries(D.http.statusUi).map(([s, t]) => h('tr', {}, h('td', { class: 'mono status-' + s }, s), h('td', {}, t))))
      )),
      h('p', { class: 'muted', style: 'margin:8px 0 0' }, 'TS 타입은 openapi.json 에서 생성합니다. 손으로 따로 쓰지 않습니다.')
    ));
  }
}

function openInterface(name) {
  showTab('map');
  select('module', providerOf[name] || 'backend');
  const el = document.getElementById('if-' + name);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ───────── 타입 사전 ───────── */
let curType = 'QueryResponse';

function renderTypeList() {
  const nav = $('#type-list');
  nav.replaceChildren();
  D.groups.forEach(([g, names]) => {
    nav.append(h('h4', {}, g));
    names.forEach(n => nav.append(h('button', {
      type: 'button', 'aria-current': String(n === curType),
      onclick: () => { curType = n; renderTypeList(); renderTypeDetail(); }
    }, n)));
  });
}

function renderTypeDetail() {
  const t = D.types[curType];
  const box = $('#type-detail');
  box.replaceChildren();
  const head = h('h2', {}, curType, h('span', { class: 'badge' }, t.kind === 'enum' ? 'enum' : 'model'));
  const card = h('div', { class: 'card' }, head);
  if (t.doc) card.append(h('p', { class: 'muted', style: 'margin:0 0 8px' }, t.doc));
  if (t.kind === 'enum') {
    card.append(h('div', { class: 'scroll' }, h('table', {},
      h('thead', {}, h('tr', {}, h('th', {}, '이름'), h('th', {}, '값'))),
      h('tbody', {}, t.values.map(v => h('tr', {}, h('td', { class: 'mono' }, v.name), h('td', { class: 'mono' }, v.value))))
    )));
  } else {
    card.append(h('div', { class: 'scroll' }, h('table', {},
      h('thead', {}, h('tr', {}, h('th', {}, '필드'), h('th', {}, '타입'), h('th', {}, ''), h('th', {}, '제약 · 기본값'))),
      h('tbody', {}, t.fields.map(f => h('tr', {},
        h('td', { class: 'mono' }, f.name),
        h('td', { class: 'mono' }, linkify(f.type)),
        h('td', {}, f.required ? h('span', { class: 'req' }, '필수') : h('span', { class: 'opt' }, '선택')),
        h('td', { class: 'mono muted' }, [...f.constraints, f.default != null ? '기본 ' + f.default : null].filter(Boolean).join(' · ') || '—')
      )))
    )));
    if (t.invariants.length) {
      card.append(h('h3', {}, '항상 성립해야 하는 규칙 (위반 시 검증 오류)'),
        h('ul', { class: 'rules' }, t.invariants.map(r => h('li', {}, r))));
    }
  }
  box.append(card);
  const users = D.modules.filter(m => m.types.includes(curType));
  if (users.length) box.append(h('div', { class: 'card' }, h('h3', { style: 'margin-top:0' }, '이 타입을 다루는 모듈'),
    h('div', { class: 'chips' }, users.map(m => h('button', { class: 'tlink', type: 'button', onclick: () => { showTab('map'); select('module', m.id); } }, m.name)))));
}

function openType(name) {
  curType = name;
  showTab('types');
  renderTypeList();
  renderTypeDetail();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ───────── HTTP · 예시 ───────── */
let exKey = 'query_answered';
const EX_LABELS = [
  ['query_request', 'POST 요청'], ['query_answered', 'answered'], ['query_needs_clarification', 'needs_clarification'],
  ['query_abstained', 'abstained'], ['query_error', 'error'], ['health_ok', 'GET /health'],
  ['session_info', 'GET /session'], ['session_not_found', 'session 404']
];

function renderHttp() {
  const box = $('#http-body');
  box.replaceChildren();
  box.append(h('div', { class: 'card' },
    h('h2', {}, '엔드포인트'),
    h('div', { class: 'scroll' }, h('table', {},
      h('thead', {}, h('tr', {}, h('th', {}, '메서드'), h('th', {}, '경로'), h('th', {}, '요청'), h('th', {}, '응답'))),
      h('tbody', {},
        h('tr', {}, h('td', { class: 'mono' }, 'GET'), h('td', { class: 'mono' }, D.http.paths.health), h('td', {}, '—'), h('td', {}, linkify('HealthResponse'))),
        h('tr', {}, h('td', { class: 'mono' }, 'POST'), h('td', { class: 'mono' }, D.http.paths.query), h('td', {}, linkify('QueryRequest')), h('td', {}, linkify('QueryResponse'))),
        h('tr', {}, h('td', { class: 'mono' }, 'GET'), h('td', { class: 'mono' }, D.http.paths.session), h('td', {}, `limit (기본 ${D.http.sessionLimit.default}, 최대 ${D.http.sessionLimit.max})`), h('td', {}, linkify('SessionInfo'), ' · 404 ', linkify('ApiError')))
      )
    ))
  ));
  box.append(h('div', { class: 'card' },
    h('h2', {}, 'error_code → HTTP 상태'),
    h('p', { class: 'muted', style: 'margin:0 0 6px' }, `answered · needs_clarification · abstained 는 모두 200, 입력 검증 실패는 422 입니다. (이 표는 /query 용. /session 은 없거나 만료된 세션에 ${D.http.sessionNotFound} + ApiError)`),
    h('div', { class: 'scroll' }, h('table', {},
      h('thead', {}, h('tr', {}, h('th', {}, 'error_code'), h('th', {}, 'HTTP'))),
      h('tbody', {}, Object.entries(D.http.errors).map(([c, s]) => h('tr', {}, h('td', { class: 'mono' }, c), h('td', { class: 'mono' }, s))))
    ))
  ));
  const ex = D.examples[exKey];
  const status = ex && ex.status;
  const card = h('div', { class: 'card' },
    h('h2', {}, '프론트 목업 예시', h('span', { class: 'badge' }, 'contracts/examples')),
    h('div', { class: 'btnrow' }, EX_LABELS.filter(([k]) => D.examples[k]).map(([k, label]) =>
      h('button', { class: 'btn', type: 'button', 'aria-pressed': String(k === exKey), onclick: () => { exKey = k; renderHttp(); } }, label))),
    status ? h('p', { style: 'margin:4px 0' }, '화면 책임: ', h('b', { class: 'status-' + status }, status), ' — ', D.http.statusUi[status]) : null,
    h('pre', {}, JSON.stringify(ex, null, 2))
  );
  box.append(card);
}

select('module', 'backend');
renderTypeList();
renderTypeDetail();
renderHttp();
</script>
</body>
</html>
