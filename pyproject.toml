[project]
name = "shipping-rag"
version = "0.1.0"
description = "PDF RAG Q&A (해운 Intermediate) — app 조립 + uv workspace 루트"
requires-python = ">=3.12"
dependencies = [
    "common",
    "chunking",
    "retrieval",
    "backend",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pypdf>=4",
    "fakeredis>=2.20",   # backend 세션 테스트용 메모리 Redis (서비스 이미지에는 넣지 않는다)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
common = { workspace = true }
chunking = { workspace = true }
retrieval = { workspace = true }
backend = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "app"]
