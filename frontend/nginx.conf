# 빌드한 정적 파일을 내려주고, 계약 API 경로(/health · /query · /session/)는 api 컨테이너로, 화면 로그(/client-logs)는 log-server 컨테이너로 넘긴다.
# api 는 compose 네트워크(rag-qa_default)에서 서비스 이름 api 로, log-server 는 docker-compose.yml 의 서비스 이름으로 찾는다.

# 화면 로그 입구는 인증 없이 열려 있어 IP 마다 요청 수를 제한한다 (zone 은 server 밖에서만 선언할 수 있다).
# Docker Desktop 처럼 포트 전달로 들어오면 모든 요청이 게이트웨이 IP 로 보여 사용자 전체에 대한 제한이 된다
limit_req_zone $binary_remote_addr zone=client_logs:1m rate=5r/s;

# 세션 id 가 있으면 대화 이력을 읽을 수 있어 접근 로그의 /session/ 주소를 가린다.
# //session/ · /%73ession/ 처럼 바꿔 써도 location 과 같은 기준으로 판단하도록 정규화된 $uri 를 본다
map $uri $log_uri {
    ~^/session/ /session/*;
    default     $request_uri;
}
log_format masked '$remote_addr [$time_iso8601] "$request_method $log_uri" $status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log masked;

    # 빌드 결과를 압축해 내려준다 (nginx 기본값은 꺼짐). 프록시한 API 응답은 압축하지 않는다 (gzip_proxied 기본값 off)
    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Docker 내장 DNS 로 요청 때마다 api 를 찾는다. api 가 늦게 뜨거나 다시 떠도 nginx 를 다시 시작하지 않아도 된다
    # (api 가 꺼져 있으면 502 를 돌려주고, 화면은 "연결 안 됨"으로 보인다)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $log_server_upstream http://log-server:3001;

    # 계약 경로만 넘긴다 (vite.config.ts 의 개발 서버 프록시와 같은 경로)
    location = /health {
        proxy_pass $api_upstream;
    }
    # 답을 만드는 데 오래 걸릴 수 있어 nginx 기본 60초 대신 넉넉히 기다린다.
    # 백엔드가 모델 대기 한도를 넘기면 status=error(model_timeout)로 먼저 답하도록, 그 한도보다 길게 둔다
    location = /query {
        proxy_pass $api_upstream;
        proxy_read_timeout 300s;
    }
    location /session/ {
        proxy_pass $api_upstream;
        # 오류 로그의 요청 줄은 가릴 수 없어(세션 id 포함) 이 경로의 연결 실패는 남기지 않는다. 실패는 화면 로그에 남는다
        error_log /var/log/nginx/error.log crit;
    }

    # 화면 로그. 개발 서버는 콘솔에만 남기므로 vite.config.ts 프록시에는 없다.
    # log-server 가 꺼져 있으면 502 만 돌아가고, 화면은 이 실패를 무시한다
    location = /client-logs {
        limit_req zone=client_logs burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_connect_timeout 2s;
        proxy_pass $log_server_upstream;
    }

    # 파일 이름에 내용 해시가 붙은 빌드 결과는 오래 캐시한다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 그 밖의 주소는 화면(index.html)으로 돌려준다. 새로고침하거나 /admin 같은 주소로 바로 들어와도 열린다
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
