[project]
name = "backend"
version = "0.1.0"
description = "FastAPI 라우터, QA 서비스, 세션, 답변 평가"
requires-python = ">=3.12"
dependencies = ["common", "pydantic>=2.7", "fastapi>=0.110"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.uv.sources]
common = { workspace = true }

[tool.rag-contract]
version = "0.1.0"
